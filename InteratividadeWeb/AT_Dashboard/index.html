<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreelanceBoard</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="app-container">
        <aside class="sidebar">
            <header class="logo-sidebar">
                <div class="logo-wrapper">
                    <span class="material-symbols-outlined icone-logo">developer_board</span>
                    <span class="texto-logo">FreelanceBoard</span>
                </div>
                <button id="btn-reduzir-nav">&lt;</button>
            </header>

            <nav>
                <ul id="menu-lista">
                    <li>
                        <a href="#" class="active-link">
                            <span class="material-symbols-outlined">home</span>
                            <span class="texto-link">Início</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <span class="material-symbols-outlined">folder</span>
                            <span class="texto-link">Projetos</span>
                        </a>
                    </li>
                    <li>
                        <a href="#">
                            <span class="material-symbols-outlined">group</span>
                            <span class="texto-link">Clientes</span>
                        </a>
                    </li>
                </ul>
            </nav>

        </aside>

        <main class="content">
            <!-- header do exercício 3 aqui -->
            <header id="titulo-painel" class="descricao-header">
                Título inicial
            </header>

             <section class="dashboard-grid">
                
                <div class="card-info-usuario">
                    <div class="perfil-header">
                        <div class="avatar-wrapper">
                            <input type="file" id="input-upload-avatar" accept="image/*" style="display: none;">
                            <!-- exercicio 5 -->
                            <img id="foto-perfil" src="https://cdn-icons-png.flaticon.com/512/3607/3607444.png" alt="Foto de Perfil">
                            <span class="status-indicator disponivel" id="status-tag"></span>
                        </div>
                        
                        <div class="perfil-info">
                            <p id="mensagem-boas-vindas">Bem-vindo de volta,</p>
                            <h2 class="user-name-text">Diogo Medeiros</h2>
                            <div class="status-badge">
                                <span id="status-texto">Disponível</span>
                                <button id="btn-alternar-status">Alterar</button>
                            </div>
                        </div>
                    </div>

                    <hr class="divisor">

                    <div class="perfil-body">
                        <h3>Minhas Habilidades</h3>
                        <ul id="lista-skills">
                            <li>HTML5</li>
                            <li>CSS3</li>
                            <li>JS</li>
                            <li>React</li>
                            <li>Node</li>
                        </ul>

                        <div class="skills-actions">
                            <div class="input-group">
                                <input type="text" id="input-skills" placeholder="Nova habilidade...">
                                <button id="btn-inserir-skill">Adicionar</button>
                            </div>
                            <button id="btn-remover-ultima-skill">Remover última</button>
                        </div>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
