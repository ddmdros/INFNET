<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Arquivo padrão</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <form action="" method="get" id="form">

    <!-- dados pessoais -->
    <fieldset class="dados-pessoais">
      <legend>Dados pessoais</legend>
      <div>
        <label for="nome">Nome</label>
        <input type="text" name="nome" id="nome">
      </div>
      <div>
        <label for="telefone">Telefone</label>
        <input type="tel" name="tel" id="tel">
      </div>
    </fieldset>
    
    <!-- preferencias -->
    <fieldset class="comidas-preferidas">
      <legend>Comidas preferidas</legend>

      <!-- comidas preferidas -->
      <div class="check-box">
        <div>
          <input type="checkbox" name="brasileira" id="brasileira">
          <label for="brasileira">Brasileira</label>
        </div>
        
        <div>
          <input type="checkbox" name="italiana" id="italiana">
          <label for="italiana">Italiana</label>
        </div>

        <div>
          <input type="checkbox" name="japonesa" id="japonesa">
          <label for="japonesa">Japonesa</label>
        </div>

      </div>

    </fieldset>

    <fieldset>
      <div class="check-box pedido-recorrente">
        <span>Já fez pedido conosco antes?</span>
        <input type="checkbox" name="clienteRecorrente" id="clienteRecorrente">
      </div>
    </fieldset>
    <!-- pedido recorrente -->

    <!-- envio -->
    <button type="submit" id="envio">Pedir</button>


  </form>
  <script src="script.js"></script>
</body>

</html>
