<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Arquivo padrão</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <form method="post">
      <div>
        <label for="nomeUser">Nome do usuário</label>
        <input type="text" name="nomeUser" id="nomeUser" placeholder="Digite seu nome">
      </div>

      <div>
        <label for="emailUser">E-mail</label>
        <input type="email" name="emailUser" id="emailUser" placeholder="Digite seu email">
      </div>

      <div>
        <label for="senhaUser">Senha</label>
        <input type="password" name="senhaUser" id="senhaUser" placeholder="Digite sua senha">
      </div>

      <div>
        <label for="idadeUser">Idade</label>
        <input type="number" name="idadeUser" id="idadeUser" placeholder="Digite sua idade">
      </div>

      <div class="block">
        <input type="submit" value="Enviar" >
      </div>
    </form>



    <script src="script.js"></script>
  </body>
</html>
