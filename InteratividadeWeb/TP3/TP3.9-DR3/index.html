<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Arquivo padrão</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <form action="" method="post">

      <fieldset>
        <div>
          <label for="pais">País</label>
          <input type="text" id="pais" name="pais">
        </div>

        <div>
          <label for="cor-bandeira">Cor principal da bandeira</label>
          <input type="color" id="cor-bandeira" name="cor-bandeira">
        </div>

        <div>
          <label for="descricao">Descrição do país</label>
          <textarea name="descricao" id="descricao" style="resize: none;"></textarea>
        </div>

        <div>
          <label for="continentes">Continente</label>
          <select name="continentes" id="continentes">
            <option value="unselected">Escolha uma opcao</option>
            <option value="america">América</option>
            <option value="africa">África</option>
            <option value="europa">Europa</option>
            <option value="asia">Ásia</option>
            <option value="oceania">Oceania</option>

          </select>
        </div>
      </fieldset>
      
      <button type="submit" id="envio">Enviar</button>

    </form>



    <script src="script.js"></script>
  </body>
</html>
