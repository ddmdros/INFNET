<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Drag and Drop API</h1>

    <section id="pai">

        <div id="origem">
            <h2 draggable="true" id="tituloh2">Me arraste</h2>
            <img src="https://img.freepik.com/vetores-gratis/ilustracao-de-icone-de-vetor-de-desenho-animado-bonito-abelha-voando-conceito-de-icone-de-natureza-animal-isolado-vetor-premium_138676-6016.jpg?semt=ais_hybrid&w=740&q=80" 
            alt="abelinha"
            id="abelha"
            draggable="true">
            
        </div>
        <div id="destino">
            <img src="https://images.unsplash.com/photo-1542801204-141ec23989d7?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Z2lyYXNzb2x8ZW58MHx8MHx8fDA%3D"
             alt="girassol"
             id="girassol"
             draggable="true">
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
